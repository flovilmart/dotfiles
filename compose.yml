# Slim dev environment for the agent workflow (see docker/README.md).
#
#   docker compose up -d
#   docker compose exec dev claude --name dispatcher
#   docker compose exec dev claude attach ENG-123
#
# Dispatcher and coordinators must live in the same container: cross-session
# messaging does not cross the container boundary.
services:
  dev:
    image: ghcr.io/flovilmart/dev-env:${DEV_ENV_TAG:-latest}
    build: .
    hostname: dev-env
    working_dir: /root/src
    tty: true
    stdin_open: true
    volumes:
      - ${SRC_DIR:-~/src}:/root/src                 # all repos, worktrees are created next to them
      - claude-config:/root/.claude                 # login, trust, sessions, coordinator state
      - volta:/root/.volta                          # Node/pnpm per project pin, cached
      - pnpm-store:/root/.local/share/pnpm          # pnpm content-addressable store
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock   # project compose files run on the host daemon
    environment:
      CLAUDE_CONFIG_DIR: /root/.claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}        # claude setup-token
      GH_TOKEN: ${GH_TOKEN:-}                                       # gh auth token (repo scope)
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      USE_BUILTIN_RIPGREP: "0"
      PW_TEST_CONNECT_WS_ENDPOINT: ws://browser:3000/              # Playwright runs browsers in the service below
      SSH_AUTH_SOCK: ${CONTAINER_SSH_AUTH_SOCK:-}
    extra_hosts:
      - host.docker.internal:host-gateway           # reach project services published on the host
    command: ["sleep", "infinity"]                  # exec into it; keeps the supervisor and background sessions alive

  # Browsers live here, not in dev-env. The version must match the project's
  # Playwright client (set PLAYWRIGHT_VERSION in .env to the project's version).
  browser:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.54.0}-jammy
    command: ["npx", "-y", "playwright@${PLAYWRIGHT_VERSION:-1.54.0}", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    init: true
    ipc: host

volumes:
  claude-config:
  volta:
  pnpm-store:
